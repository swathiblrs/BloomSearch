[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloom-filter-demo"
version = "0.3.0"
description = "Bloom-filter-accelerated collection search, bounded web crawling, and optional model APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Swathi BS" }]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
bloom-filter = "bloom_filter.cli:main"
bloom-search = "bloom_search.cli:main"

[tool.setuptools.packages.find]
include = ["bloom_filter*", "bloom_search*"]
